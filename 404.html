<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · ALPALOVA</title>
<style>
:root{--page:#F1EBDD;--ink:#1C1A17;--muted:#696258;--rule:#AFA593}
@media (prefers-color-scheme:dark){:root{--page:#14120F;--ink:#EEE8DC;--muted:#9A9184;--rule:#4A443C}}
html{background:var(--page)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--page);color:var(--ink);font:300 clamp(1.8rem,5vw,3rem)/1.15 "Cormorant Garamond",Garamond,"Times New Roman",serif;text-align:center}
main{display:grid;gap:1.6rem;justify-items:center}
small{font:500 .68rem/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:300;font-size:inherit}
a{font:500 .7rem/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding-block:.55rem;border-bottom:1px solid var(--rule)}
a:hover{border-bottom-color:var(--ink)}
</style>
<script>
/* /store, /our-story, /contact and product names typed as addresses open the matching page of the site */
function resolve(host,path){
  var segs=path.split('/').filter(Boolean),base='/';
  if(/\.github\.io$/i.test(host)&&segs.length){base='/'+segs.shift()+'/'}
  var key=segs.join('/').toLowerCase().replace(/\.html?$/,'');
  var map={'store':'store','shop':'store','collection':'store','our-story':'story','story':'story','about':'story','contact':'contact','contacts':'contact'};
  var target=map[key]?'#'+map[key]:(/^p-[a-z0-9-]+$/.test(key)?'#'+key:'');
  return {base:base,target:target};
}
var r=resolve(location.hostname,location.pathname);
if(r.target){location.replace(r.base+r.target)}
document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('home');if(a)a.setAttribute('href',r.base)});
</script>
</head>
<body>
<main>
<small>ALPALOVA</small>
<h1>Page not found</h1>
<a id="home" href="/">Back to the home page</a>
</main>
</body>
</html>
